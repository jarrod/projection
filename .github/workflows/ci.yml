name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      # Builds (type check and size budgets), then the agent snapshot, unit and MCP host tests.
      - run: npm test
      # The build copies docs pages into the skill; the committed copies must match.
      - run: git diff --exit-code -- skills
      # The tarball must carry a built dist.
      - run: npm pack --dry-run
