name: ci
# Limited on purpose: Actions minutes cost money. Build, agent snapshot and unit tests only.
# The browser (test:web) and Workers (test:workers) suites run locally, never here.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Skips the Worker example, so wrangler and workerd are never downloaded.
      - run: pnpm install --frozen-lockfile --filter mcp-projector --filter notes-server-example
      # Builds (type check and size budgets), then the agent snapshot and the unit project.
      - run: pnpm test
      # The tarball must carry a built dist.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP" --json | grep -q '"dist/index.js"'
